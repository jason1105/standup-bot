name: Daily Standup

on:
  schedule:
    # Weekdays at 08:30 UTC (16:30 CST)
    - cron: "30 8 * * 1-5"
  workflow_dispatch:

permissions:
  issues: write   # 失败告警需要开 issue
  contents: write
  pull-requests: write

jobs:
  standup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests
        run: pip install requests --quiet

      - name: Generate standup
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          # 过渡期保留 OpenRouter 兜底，切稳后可删
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          # 优先用 secret，未配置时回退到仓库 owner（避免用 GITHUB_TOKEN 调 /user 触发 403）
          GH_USERNAME: ${{ secrets.GH_USERNAME || github.repository_owner }}
        run: |
          python3 scripts/generate_standup.py

      - name: Commit and push
        run: |
          git config user.name  "standup-bot"
          git config user.email "standup-bot@users.noreply.github.com"
          git add standups/
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "standup: ${{ env.TODAY || '$(date +%Y-%m-%d)' }}"
          # --- 改造：bot 不再直推 main，改为开 PR 并自动合并 ---
          git fetch origin main --depth=1 -q
          if [ -z "$(git log FETCH_HEAD..HEAD --oneline)" ]; then
            echo "No new commits; nothing to do."
            exit 0
          fi
          BRANCH="bot/$(date -u +%Y%m%d-%H%M%S)"
          git push -u origin "HEAD:$BRANCH"
          export GH_TOKEN="${{ secrets.GITHUB_TOKEN }}"
          gh pr create --base main --head "$BRANCH" \
            --title "$(git log -1 --pretty=%s)" \
            --body "Automated update by workflow: ${{ github.workflow }}"
          gh pr merge "$BRANCH" --squash --delete-branch
      - name: Notify on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="⚠️ 工作流 ${{ github.workflow }} 运行失败"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          BODY="[${{ github.workflow }}]($RUN_URL) 于 $(date -u '+%Y-%m-%d %H:%M UTC') 失败（分支 ${{ github.ref_name }}，触发 ${{ github.event_name }}）。请查看日志。"
          EXISTING=$(gh issue list --state open --search "in:title $TITLE" --json number,title --jq "[.[] | select(.title == \"$TITLE\")] | .[0].number")
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh label create ci-failure --color d73a4a --description "自动化工作流失败告警" 2>/dev/null || true
            gh issue create --title "$TITLE" --body "$BODY" --label ci-failure 2>/dev/null || gh issue create --title "$TITLE" --body "$BODY"
          fi
