<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>每日站会归档</title>
<style>
:root {
  --bg: #f9f9f8;
  --surface: #ffffff;
  --text: #1c1917;
  --muted: #78716c;
  --border: #e7e5e4;
  --accent: #0f766e;      /* teal-700 */
  --accent-light: #ccfbf1;
  --today: #0f766e;
  --has-standup: #d1fae5;
  --has-standup-text: #065f46;
  --weekend: #f5f4f2;
  --tag-bg: #f5f4f2;
}
[data-theme="dark"] {
  --bg: #18181b;
  --surface: #1e1e21;
  --text: #faf9f7;
  --muted: #a8a29e;
  --border: #2a2a2f;
  --accent: #2dd4bf;
  --accent-light: #134e4a;
  --has-standup: #134e4a;
  --has-standup-text: #5eead4;
  --weekend: #1a1a1d;
  --tag-bg: #27272a;
}
*,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif;
  background: var(--bg); color: var(--text);
  line-height: 1.6; font-size: 15px;
  transition: background .25s, color .25s;
  min-height: 100vh;
}
.container { max-width: 860px; margin: 0 auto; padding: 0 24px; }

/* Header */
.site-header { padding: 24px 0 18px; border-bottom: 1px solid var(--border); margin-bottom: 32px; }
.header-inner { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.site-title { font-size: 18px; font-weight: 700; letter-spacing: -.02em; }
.site-title small { font-size: 13px; font-weight: 400; color: var(--muted); margin-left: 8px; letter-spacing: 0; }
.theme-btn {
  background: none; border: 1px solid var(--border); border-radius: 6px;
  cursor: pointer; padding: 4px 10px; color: var(--muted); font-size: 12px;
  transition: border-color .15s, color .15s; white-space: nowrap;
}
.theme-btn:hover { border-color: var(--accent); color: var(--accent); }

/* Stats row */
.stats-row { display: flex; gap: 20px; margin-bottom: 28px; flex-wrap: wrap; }
.stat-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
  padding: 14px 20px; min-width: 120px;
}
.stat-card .num { font-size: 26px; font-weight: 700; color: var(--accent); line-height: 1.1; }
.stat-card .label { font-size: 12px; color: var(--muted); margin-top: 2px; }

/* Main layout */
.main-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; align-items: start; }
@media (max-width: 620px) { .main-layout { grid-template-columns: 1fr; } }

/* Calendar */
.calendar-panel { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
.cal-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.cal-title { font-size: 15px; font-weight: 600; }
.cal-btn {
  background: none; border: 1px solid var(--border); border-radius: 6px;
  cursor: pointer; padding: 3px 9px; color: var(--muted); font-size: 13px;
  transition: border-color .15s, color .15s;
}
.cal-btn:hover { border-color: var(--accent); color: var(--accent); }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
.cal-dow {
  text-align: center; font-size: 11px; color: var(--muted);
  padding: 4px 0; font-weight: 500;
}
.cal-cell {
  aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
  border-radius: 6px; font-size: 12px; cursor: default;
  transition: background .12s;
  position: relative;
}
.cal-cell.empty { opacity: 0; pointer-events: none; }
.cal-cell.weekend { color: var(--muted); }
.cal-cell.has-standup {
  background: var(--has-standup); color: var(--has-standup-text);
  cursor: pointer; font-weight: 600;
}
.cal-cell.has-standup:hover { filter: brightness(.95); }
.cal-cell.is-today { outline: 2px solid var(--accent); outline-offset: -1px; }
.cal-cell.selected { background: var(--accent); color: #fff; }

/* Standup panel */
.standup-panel { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; min-height: 280px; }
.standup-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; gap: 8px; flex-wrap: wrap; }
.standup-date { font-size: 14px; font-weight: 600; }
.standup-actions { display: flex; gap: 8px; }
.copy-btn {
  background: none; border: 1px solid var(--border); border-radius: 6px;
  cursor: pointer; padding: 4px 10px; color: var(--muted); font-size: 12px;
  transition: border-color .15s, color .15s;
}
.copy-btn:hover { border-color: var(--accent); color: var(--accent); }
.copy-btn.copied { border-color: var(--accent); color: var(--accent); }
.standup-empty {
  color: var(--muted); font-size: 14px;
  display: flex; align-items: center; justify-content: center;
  height: 160px; text-align: center; flex-direction: column; gap: 8px;
}
.standup-content { font-size: 14px; line-height: 1.75; white-space: pre-wrap; }
.standup-content strong { font-weight: 600; color: var(--text); display: block; margin-top: 14px; margin-bottom: 4px; }
.standup-content strong:first-child { margin-top: 0; }

/* History list */
.history-panel { margin-top: 24px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
.history-title { font-size: 14px; font-weight: 600; margin-bottom: 14px; }
.history-list { display: flex; flex-direction: column; gap: 2px; max-height: 280px; overflow-y: auto; }
.history-item {
  display: flex; align-items: center; gap: 12px; padding: 8px 10px; border-radius: 7px;
  cursor: pointer; transition: background .12s; font-size: 13px;
}
.history-item:hover { background: var(--tag-bg); }
.history-item.active { background: var(--has-standup); color: var(--has-standup-text); }
.history-item .h-date { font-weight: 500; flex-shrink: 0; }
.history-item .h-preview { color: var(--muted); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; flex: 1; font-size: 12px; }
.history-item.active .h-preview { color: var(--has-standup-text); opacity: .8; }

/* Footer */
.site-footer { border-top: 1px solid var(--border); padding: 24px 0; text-align: center; color: var(--muted); font-size: 12px; margin-top: 32px; }
</style>
</head>
<body>
<script>
(function(){
  const t = localStorage.getItem('theme') || 'light';
  document.documentElement.setAttribute('data-theme', t);
  function updateBtn(t){ const b=document.getElementById('theme-btn'); if(b) b.textContent=t==='dark'?'亮色模式':'暗色模式'; }
  updateBtn(t);
  window.toggleTheme = function(){
    const cur = document.documentElement.getAttribute('data-theme');
    const next = cur==='dark'?'light':'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('theme', next);
    updateBtn(next);
  };
})();
</script>

<div class="container">
  <header class="site-header">
    <div class="header-inner">
      <div class="site-title">
        每日站会归档
        <small>Daily Standup Archive</small>
      </div>
      <button id="theme-btn" class="theme-btn" onclick="toggleTheme()">暗色模式</button>
    </div>
  </header>

  <div class="stats-row">
    <div class="stat-card">
      <div class="num" id="stat-total">—</div>
      <div class="label">站会总数</div>
    </div>
    <div class="stat-card">
      <div class="num" id="stat-streak">—</div>
      <div class="label">连续工作日</div>
    </div>
    <div class="stat-card">
      <div class="num" id="stat-month">—</div>
      <div class="label">本月站会</div>
    </div>
  </div>

  <div class="main-layout">
    <!-- Calendar -->
    <div>
      <div class="calendar-panel">
        <div class="cal-nav">
          <button class="cal-btn" id="prev-month" onclick="changeMonth(-1)">‹ 上月</button>
          <span class="cal-title" id="cal-title"></span>
          <button class="cal-btn" id="next-month" onclick="changeMonth(1)">下月 ›</button>
        </div>
        <div class="cal-grid" id="cal-grid"></div>
      </div>

      <!-- History list -->
      <div class="history-panel">
        <div class="history-title">全部归档</div>
        <div class="history-list" id="history-list"></div>
      </div>
    </div>

    <!-- Standup content -->
    <div class="standup-panel">
      <div class="standup-header">
        <span class="standup-date" id="standup-date">选择一天查看站会内容</span>
        <div class="standup-actions">
          <button class="copy-btn" id="copy-btn" onclick="copyStandup()" style="display:none">复制</button>
        </div>
      </div>
      <div id="standup-body">
        <div class="standup-empty">
          <div>点击日历中高亮的日期</div>
          <div style="font-size:12px">查看当天站会内容</div>
        </div>
      </div>
    </div>
  </div>

  <footer class="site-footer">
    由 GitHub Actions + Claude API 自动生成 · 每个工作日 08:30 UTC 运行
  </footer>
</div>

<script>
// ── State ──────────────────────────────────────────────────────────────────
let allDates = [];         // ISO date strings with standups, descending
let standupCache = {};     // date -> markdown text
let viewYear, viewMonth;   // calendar month being shown
let selectedDate = null;

const today = new Date();
viewYear  = today.getFullYear();
viewMonth = today.getMonth(); // 0-based

// ── Init ───────────────────────────────────────────────────────────────────
async function init() {
  try {
    const r = await fetch("standups/index.json");
    if (!r.ok) throw new Error("index.json not found");
    allDates = await r.json();
  } catch (e) {
    // Fallback: hardcoded for pre-built demo
    allDates = ["2026-08-19"];
  }
  updateStats();
  renderCalendar();
  renderHistory();

  // Auto-select latest
  if (allDates.length > 0) {
    selectDate(allDates[0]);
  }
}

// ── Stats ──────────────────────────────────────────────────────────────────
function updateStats() {
  document.getElementById("stat-total").textContent = allDates.length;

  // Streak: consecutive weekdays backwards from latest
  let streak = 0;
  if (allDates.length > 0) {
    const dateSet = new Set(allDates);
    let d = new Date(allDates[0] + "T00:00:00");
    while (true) {
      const iso = d.toISOString().slice(0, 10);
      if (!dateSet.has(iso)) break;
      streak++;
      // Go to previous weekday
      d.setDate(d.getDate() - 1);
      while (d.getDay() === 0 || d.getDay() === 6) d.setDate(d.getDate() - 1);
    }
  }
  document.getElementById("stat-streak").textContent = streak;

  // This month
  const ym = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}`;
  const monthCount = allDates.filter(d => d.startsWith(ym)).length;
  document.getElementById("stat-month").textContent = monthCount;
}

// ── Calendar ───────────────────────────────────────────────────────────────
function changeMonth(delta) {
  viewMonth += delta;
  if (viewMonth > 11) { viewMonth = 0; viewYear++; }
  if (viewMonth < 0)  { viewMonth = 11; viewYear--; }
  renderCalendar();
}

function renderCalendar() {
  const dateSet = new Set(allDates);
  const firstDay = new Date(viewYear, viewMonth, 1);
  const lastDay  = new Date(viewYear, viewMonth + 1, 0);
  const todayISO = today.toISOString().slice(0, 10);

  document.getElementById("cal-title").textContent =
    `${viewYear}年 ${viewMonth + 1}月`;

  const grid = document.getElementById("cal-grid");
  grid.innerHTML = "";

  // Day-of-week headers (Mon first)
  const dows = ["一","二","三","四","五","六","日"];
  dows.forEach(d => {
    const el = document.createElement("div");
    el.className = "cal-dow";
    el.textContent = d;
    grid.appendChild(el);
  });

  // Blank cells before first day (Mon=0)
  const startDow = (firstDay.getDay() + 6) % 7; // 0=Mon
  for (let i = 0; i < startDow; i++) {
    const el = document.createElement("div");
    el.className = "cal-cell empty";
    grid.appendChild(el);
  }

  for (let day = 1; day <= lastDay.getDate(); day++) {
    const iso = `${viewYear}-${String(viewMonth+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    const dow  = (new Date(viewYear, viewMonth, day).getDay() + 6) % 7;
    const el = document.createElement("div");
    el.textContent = day;

    let cls = "cal-cell";
    if (dow >= 5) cls += " weekend";
    if (dateSet.has(iso)) cls += " has-standup";
    if (iso === todayISO) cls += " is-today";
    if (iso === selectedDate) cls += " selected";
    el.className = cls;

    if (dateSet.has(iso)) {
      el.title = `查看 ${iso} 的站会`;
      el.onclick = () => selectDate(iso);
    }
    grid.appendChild(el);
  }
}

// ── History list ───────────────────────────────────────────────────────────
function renderHistory() {
  const list = document.getElementById("history-list");
  list.innerHTML = "";
  allDates.forEach(d => {
    const el = document.createElement("div");
    el.className = "history-item" + (d === selectedDate ? " active" : "");
    el.dataset.date = d;
    el.innerHTML = `<span class="h-date">${d}</span><span class="h-preview" id="preview-${d}">加载中…</span>`;
    el.onclick = () => selectDate(d);
    list.appendChild(el);
    // Load preview
    loadStandup(d).then(text => {
      const pre = document.getElementById(`preview-${d}`);
      if (pre) pre.textContent = text.replace(/^#[^\n]+\n+/, "").replace(/\*\*/g, "").split("\n").find(l => l.trim() && !l.startsWith("#")) || "";
    });
  });
}

// ── Load standup ───────────────────────────────────────────────────────────
async function loadStandup(date) {
  if (standupCache[date]) return standupCache[date];
  try {
    const r = await fetch(`standups/${date}.md`);
    if (!r.ok) throw new Error("not found");
    const text = await r.text();
    standupCache[date] = text;
    return text;
  } catch(e) {
    return `# 每日站会 - ${date}\n\n（文件加载失败）`;
  }
}

// ── Select date ────────────────────────────────────────────────────────────
async function selectDate(date) {
  selectedDate = date;

  // Update calendar (re-render if needed)
  const [y, m] = date.split("-").map(Number);
  if (y !== viewYear || m - 1 !== viewMonth) {
    viewYear = y; viewMonth = m - 1;
  }
  renderCalendar();

  // Update history active state
  document.querySelectorAll(".history-item").forEach(el => {
    el.classList.toggle("active", el.dataset.date === date);
  });

  document.getElementById("standup-date").textContent = `${date} 站会记录`;
  document.getElementById("copy-btn").style.display = "inline";

  const text = await loadStandup(date);
  // Render markdown-lite
  const html = text
    .replace(/^# .+\n+/, "")           // remove h1 title
    .trim()
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .split("\n")
    .map(line => {
      if (line.startsWith("- ")) return `<span style="display:block;padding-left:1em">· ${escHtml(line.slice(2))}</span>`;
      if (line.trim() === "") return "<br>";
      return escHtml(line).replace(/&lt;strong&gt;/g, "<strong>").replace(/&lt;\/strong&gt;/g, "</strong>");
    })
    .join("\n");

  // Re-do: just keep it simple with pre-wrap and minimal formatting
  const rendered = text
    .replace(/^# .+\n+/, "")
    .trim()
    .replace(/\*\*(.+?)\*\*/g, (_, m) => `<strong>${m}</strong>`);

  document.getElementById("standup-body").innerHTML =
    `<div class="standup-content">${rendered}</div>`;
}

function escHtml(s) {
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

// ── Copy ───────────────────────────────────────────────────────────────────
async function copyStandup() {
  if (!selectedDate) return;
  const text = await loadStandup(selectedDate);
  const btn = document.getElementById("copy-btn");
  try {
    await navigator.clipboard.writeText(text);
    btn.textContent = "已复制!";
    btn.classList.add("copied");
    setTimeout(() => { btn.textContent = "复制"; btn.classList.remove("copied"); }, 2000);
  } catch(e) {
    btn.textContent = "复制失败";
    setTimeout(() => { btn.textContent = "复制"; }, 2000);
  }
}

// ── Start ──────────────────────────────────────────────────────────────────
init();
</script>
</body>
</html>
